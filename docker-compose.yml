# docker compose up --build   →   http://localhost:3000
# Jenkins (jenkins-local) deploys this same file with TODO_TAG=<build>-<sha> and DB_PASSWORD from its credentials.
#
# No Postgres of its own: it uses worktime's (service "postgres" on the worktime_default network), so worktime
# must be running. Role, database and schema are created by deploy/bootstrap-db.sh.
name: todo-list

services:
  app:
    build: .
    image: todo-list-app:${TODO_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${TODO_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${DB_USER:-todoapp}:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/${DB_NAME:-tododb}
    healthcheck:
      # GET / queries the todos table, so healthy means app + DB + schema all work.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/"]
      interval: 5s
      retries: 10

  cleaner:
    build: ./cron
    image: todo-list-cleaner:${TODO_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-todoapp}:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/${DB_NAME:-tododb}

networks:
  default:
    name: worktime_default
    external: true
